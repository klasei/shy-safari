<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Google Tag Manager — safaris.klasei.lt (GTM-WF9C5VRM). The GA4
         property G-X5Q12KGFCD is configured inside that container. -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WF9C5VRM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <script>
      // The page is prerendered without a Scene, which appears only once the
      // saved one is known. Until then, paint the saved Scene's colours so a
      // reload doesn't flash. Keep in step with settings.svelte.ts.
      try {
        var saved = JSON.parse(
          localStorage.getItem("class-noise-level:settings") || "{}",
        ).scene;
        if (saved) document.documentElement.dataset.scene = saved;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
