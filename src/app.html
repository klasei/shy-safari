<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Google Tag Manager — safaris.klasei.lt now uses the same container as
         the front page (GTM-PXTF6HJR), whose GA4 tag reports to property
         G-Q78SL3XCNG. So safaris.klasei.lt and klasei.lt share one GA4
         property. (The old dedicated safaris property was retired.) -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PXTF6HJR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <script>
      // The page is prerendered without a Scene, which appears only once the
      // saved one is known. Until then, paint the saved Scene's colours so a
      // reload doesn't flash. Keep in step with settings.svelte.ts.
      try {
        var saved = JSON.parse(
          localStorage.getItem("class-noise-level:settings") || "{}",
        ).scene;
        if (saved) document.documentElement.dataset.scene = saved;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
